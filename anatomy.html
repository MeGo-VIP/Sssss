#anatomy-section {
  padding: 0;
}

.anatomy-root {
  position: relative;
  width: 100%;
  height: min(78vh, 720px);
  min-height: 420px;

  overflow: hidden;
  background: #0e1620;
  display: flex;
  flex-direction: column;
}

.anatomy-topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--glass-bg, rgba(20,26,36,0.6));
  border-bottom: 1px solid var(--glass-border, rgba(255,255,255,0.08));
  z-index: 3;
}

.anatomy-search {
  flex: 1 1 200px;
  min-width: 140px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--glass-border, rgba(255,255,255,0.15));
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-size: 0.9rem;
}

.anatomy-body {
  position: relative;
  flex: 1;
  display: flex;
  min-height: 0;
}

.anatomy-viewport {
  position: relative;
  flex: 1;
  min-width: 0;
}
.anatomy-viewport canvas { display: block; touch-action: none; }

.anatomy-notice {
  position: absolute;
  top: 10px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  background: rgba(15,107,158,0.92);
  color: #fff;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.78rem;
  z-index: 4;
  white-space: nowrap;
  max-width: 92%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.anatomy-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 0.95rem;
  background: rgba(14,22,32,0.6);
  z-index: 5;
  flex-direction: column;
  gap: 10px;
}
.anatomy-spinner {
  width: 34px; height: 34px;
  border: 3px solid rgba(255,255,255,0.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: anatomySpin 0.8s linear infinite;
}
@keyframes anatomySpin { to { transform: rotate(360deg); } }

.anatomy-fps {
  position: absolute;
  bottom: 8px;
  inset-inline-end: 8px;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.55);
  z-index: 4;
}

/* Floating view controls (front/back/left/right/reset) */
.anatomy-viewctrl {
  position: absolute;
  bottom: 10px;
  inset-inline-start: 10px;
  display: flex;
  gap: 6px;
  z-index: 4;
  flex-wrap: wrap;
  max-width: calc(100% - 20px);
}
.anatomy-viewctrl button {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.75rem;
  cursor: pointer;
}
.anatomy-viewctrl button:hover { background: rgba(255,255,255,0.22); }

/* Layer toggles */
.anatomy-layers {
  position: absolute;
  top: 54px;
  inset-inline-start: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 4;
  background: rgba(14,22,32,0.65);
  padding: 8px;
  border-radius: 10px;
}
.anatomy-layer-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.75);
  font-size: 0.75rem;
  cursor: pointer;
  padding: 3px 4px;
  border-radius: 6px;
  text-align: start;
}
.anatomy-layer-btn.active { color: #fff; background: rgba(59,130,246,0.25); }

.anatomy-info-panel {
  width: 300px;
  flex: 0 0 auto;
  background: var(--glass-bg, rgba(20,26,36,0.75));
  border-inline-start: 1px solid var(--glass-border, rgba(255,255,255,0.08));

  overflow-y: auto;
  color: #fff;

.anatomy-info-row { font-size: 0.85rem; margin-top: 8px; line-height: 1.5; }

// ───────────────────────────── core/eventBus.js ─────────────────────────────
// core/eventBus.js — tiny pub/sub used across all Anatomy modules.
// Kept dependency-free so any module (including future phases) can import it
// without pulling in Three.js.

class EventBus {
  constructor() {
    this._events = new Map();
  }

  on(name, handler) {
    if (!this._events.has(name)) this._events.set(name, new Set());
    this._events.get(name).add(handler);
    return () => this.off(name, handler); // convenience unsubscribe
  }

  off(name, handler) {
    const set = this._events.get(name);
    if (set) set.delete(handler);
  }

  emit(name, payload) {
    const set = this._events.get(name);
    if (!set) return;
    // copy to array so a handler can unsubscribe itself mid-emit safely
    Array.from(set).forEach((fn) => {
      try {
        fn(payload);
      } catch (err) {
        console.error(`[Anatomy:eventBus] handler for "${name}" threw:`, err);
      }
    });
  }

  clear() {
    this._events.clear();
  }
}

// ───────────────────────────── core/lighting.js ─────────────────────────────
// core/lighting.js — a small, mobile-friendly lighting rig.
// Keep light count low (perf requirement): 1 hemisphere + 1 key directional
// (with shadow) + 1 soft fill. No point lights (expensive on mobile GPUs).

function buildLightingRig(scene, { enableShadows = true } = {}) {
  const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.9);
  scene.add(hemi);

  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(2.5, 4, 3);
  key.castShadow = enableShadows;
  if (enableShadows) {
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 15;
    key.shadow.bias = -0.0005;
  }
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xbdd7ff, 0.35);
  fill.position.set(-3, 1.5, -2);
  scene.add(fill);

  return { hemi, key, fill };
}


// ───────────────────────────── core/camera.js ─────────────────────────────
// core/camera.js — camera + OrbitControls wrapper with named view presets
// and a smooth focusOn() used by search results, region navigation, and the
// public AnatomyAPI.focusOn(name).


const VIEW_PRESETS = {
  front: { pos: [0, 1.4, 4.2], target: [0, 1.1, 0] },
  back: { pos: [0, 1.4, -4.2], target: [0, 1.1, 0] },
  left: { pos: [-4.2, 1.4, 0], target: [0, 1.1, 0] },
  right: { pos: [4.2, 1.4, 0], target: [0, 1.1, 0] },
  reset: { pos: [0, 1.4, 4.2], target: [0, 1.1, 0] },
};

class AnatomyCamera {
  constructor(domElement, aspect) {
    this.camera = new THREE.PerspectiveCamera(45, aspect, 0.05, 100);
    this.camera.position.set(...VIEW_PRESETS.front.pos);

    this.controls = new OrbitControls(this.camera, domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.08;
    this.controls.minDistance = 0.6;
    this.controls.maxDistance = 12;
    this.controls.target.set(...VIEW_PRESETS.front.target);
    this.controls.update();

    this._animId = null;
  }

  setAspect(aspect) {
    this.camera.aspect = aspect;
    this.camera.updateProjectionMatrix();
  }

  update() {
    this.controls.update();
  }

  goToPreset(name, animate = true) {
    const preset = VIEW_PRESETS[name] || VIEW_PRESETS.reset;
    this.flyTo(preset.pos, preset.target, animate);
  }

  // Smoothly move the camera to a position while looking at a target.
  // object3D (optional): if provided, its world position is used as target
  // and the camera offsets from its bounding sphere — used by focusOn(partId).
  flyTo(position, target, animate = true) {
    if (this._animId) cancelAnimationFrame(this._animId);

    const startPos = this.camera.position.clone();
    const startTarget = this.controls.target.clone();
    const endPos = new THREE.Vector3(...position);
    const endTarget = new THREE.Vector3(...target);

    if (!animate) {
      this.camera.position.copy(endPos);
      this.controls.target.copy(endTarget);
      this.controls.update();
      return;
    }

    const duration = 600; // ms
    const start = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3); // easeOutCubic

    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const e = ease(t);
      this.camera.position.lerpVectors(startPos, endPos, e);
      this.controls.target.lerpVectors(startTarget, endTarget, e);
      this.controls.update();
      if (t < 1) {
        this._animId = requestAnimationFrame(step);
      } else {
        this._animId = null;
      }
    };
    this._animId = requestAnimationFrame(step);
  }

  focusOnObject3D(object3D) {
    if (!object3D) return;
    const box = new THREE.Box3().setFromObject(object3D);
    if (box.isEmpty()) return;
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z) * 0.9 + 0.3;
    const dir = new THREE.Vector3(0.6, 0.35, 1).normalize();
    const camPos = center.clone().addScaledVector(dir, radius * 2.2);
    this.flyTo([camPos.x, camPos.y, camPos.z], [center.x, center.y, center.z], true);
  }

  dispose() {
    if (this._animId) cancelAnimationFrame(this._animId);
    this.controls.dispose();
  }
}


// ───────────────────────────── core/raycast.js ─────────────────────────────
// core/raycast.js — pointer selection (works for mouse AND touch via
// pointer events), resolves the clicked mesh's nearest ancestor that carries
// userData.partId, and emits a 'select' event on the shared bus.


class AnatomySelector {
  constructor(camera, scene, domElement) {
    this.camera = camera;
    this.scene = scene;
    this.domElement = domElement;
    this.raycaster = new THREE.Raycaster();
    this.pointer = new THREE.Vector2();

    this._onPointerUp = this._onPointerUp.bind(this);
    this._downPos = null;
    this._onPointerDown = this._onPointerDown.bind(this);

    domElement.addEventListener('pointerdown', this._onPointerDown, { passive: true });
    domElement.addEventListener('pointerup', this._onPointerUp, { passive: true });
  }

  _onPointerDown(e) {
    this._downPos = { x: e.clientX, y: e.clientY };
  }

  _onPointerUp(e) {
    // Ignore drags (orbit rotation) — only treat near-stationary taps as selection.
    if (this._downPos) {
      const dx = e.clientX - this._downPos.x;
      const dy = e.clientY - this._downPos.y;
      if (Math.sqrt(dx * dx + dy * dy) > 6) {
        this._downPos = null;
        return;
      }
    }
    this._downPos = null;

    const rect = this.domElement.getBoundingClientRect();
    this.pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    this.pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    this.raycaster.setFromCamera(this.pointer, this.camera);
    const hits = this.raycaster.intersectObjects(this.scene.children, true);

    for (const hit of hits) {
      let obj = hit.object;
      while (obj) {
        if (obj.userData && obj.userData.partId) {
          anatomyBus.emit('select', { partId: obj.userData.partId, object3D: obj, point: hit.point });
          return;
        }
        obj = obj.parent;
      }
    }
    anatomyBus.emit('select-none');
  }

  dispose() {
    this.domElement.removeEventListener('pointerdown', this._onPointerDown);
    this.domElement.removeEventListener('pointerup', this._onPointerUp);
  }
}


// ───────────────────────────── core/engine.js ─────────────────────────────
// core/engine.js — scene/renderer lifecycle, adaptive quality, model loading
// with a safe placeholder fallback, and memory-safe disposal.






const THREE_VERSION_PATH = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/';

class AnatomyEngine {
  constructor(container) {
    this.container = container;
    this.disposed = false;
    this._resizeObserver = null;
    this._rafId = null;
    this._clock = new THREE.Clock();
    this._fps = 0;
    this._fpsFrames = 0;
    this._fpsLast = performance.now();
    this._running = false;

    this._buildRenderer();
    this._buildScene();

    this.anatomyCamera = new AnatomyCamera(this.renderer.domElement, this._aspect());
    buildLightingRig(this.scene, { enableShadows: !this._isLowPowerDevice() });

    this.modelRoot = new THREE.Group();
    this.modelRoot.name = 'anatomy-model-root';
    this.scene.add(this.modelRoot);

    this._ground();
    this._observeResize();
  }

  // ---- setup -------------------------------------------------------------

  _isLowPowerDevice() {
    const mem = navigator.deviceMemory; // not on all browsers
    return (mem && mem <= 4) || /Android|iPhone|iPad/i.test(navigator.userAgent);
  }

  _aspect() {
    const w = this.container.clientWidth || 1;
    const h = this.container.clientHeight || 1;
    return w / h;
  }

  _buildRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    const dpr = this._isLowPowerDevice() ? Math.min(window.devicePixelRatio || 1, 1.5) : Math.min(window.devicePixelRatio || 1, 2);
    this.renderer.setPixelRatio(dpr);
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.shadowMap.enabled = !this._isLowPowerDevice();
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.container.appendChild(this.renderer.domElement);
  }

  _buildScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0e1620);
    this.scene.fog = new THREE.Fog(0x0e1620, 6, 16);
  }

  _ground() {
    const geo = new THREE.CircleGeometry(3, 32);
    const mat = new THREE.MeshStandardMaterial({ color: 0x141d29, roughness: 1, metalness: 0 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.receiveShadow = true;
    mesh.name = 'anatomy-ground';
    this.scene.add(mesh);
  }

  _observeResize() {
    this._resizeObserver = new ResizeObserver(() => this._onResize());
    this._resizeObserver.observe(this.container);
  }

  _onResize() {
    const w = this.container.clientWidth || 1;
    const h = this.container.clientHeight || 1;
    this.renderer.setSize(w, h);
    this.anatomyCamera.setAspect(w / h);
  }

  // ---- render loop ---------------------------------------------------

  start(onFrame) {
    if (this._running) return;
    this._running = true;
    const loop = () => {
      if (!this._running) return;
      this._rafId = requestAnimationFrame(loop);
      this.anatomyCamera.update();
      this.renderer.render(this.scene, this.anatomyCamera.camera);

      this._fpsFrames++;
      const now = performance.now();
      if (now - this._fpsLast >= 1000) {
        this._fps = this._fpsFrames;
        this._fpsFrames = 0;
        this._fpsLast = now;
        if (onFrame) onFrame(this._fps);
      }
    };
    loop();
  }

  stop() {
    this._running = false;
    if (this._rafId) cancelAnimationFrame(this._rafId);
    this._rafId = null;
  }

  // ---- model loading -----------------------------------------------------

  // Tries to load a real GLB from the given URL. On any failure (404, parse
  // error, etc.) it resolves with `{ placeholder: true }` and builds a
  // procedural stand-in body instead — it NEVER throws up to the caller and
  // never pretends the placeholder is a verified anatomical model.
  async loadModel(url, { onProgress } = {}) {
    const loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath(THREE_VERSION_PATH);
    loader.setDRACOLoader(draco);

    try {
      const gltf = await new Promise((resolve, reject) => {
        loader.load(
          url,
          resolve,
          (evt) => {
            if (onProgress && evt.total) onProgress(evt.loaded / evt.total);
          },
          reject
        );
      });
      this._ingestModel(gltf.scene);
      return { placeholder: false };
    } catch (err) {
      console.info('[Anatomy] Real model not found/failed to load — using placeholder body.', err && err.message);
      this.buildPlaceholderBody();
      return { placeholder: true };
    }
  }

  // Walks the loaded model, tags each mesh with userData.layer / userData.partId
  // by matching its node name against data/anatomy-map.js, and enables shadows.
  _ingestModel(root) {
    root.traverse((obj) => {
      if (!obj.isMesh) return;
      obj.castShadow = true;
      obj.receiveShadow = true;
      const layer = findLayerByNodeName(obj.name);
      const part = findPartByNodeName(obj.name);
      if (layer) obj.userData.layer = layer.id;
      if (part) obj.userData.partId = part.id;
    });
    this.modelRoot.add(root);
  }

  // A low-poly procedural stand-in so the FULL pipeline (layers, raycast
  // selection, camera focus, info panel) is demonstrably working before a
  // licensed anatomical model is available. Clearly named per the layer
  // system's conventions so swapping in a real GLB later needs no code change.
  buildPlaceholderBody() {
    const group = new THREE.Group();
    group.name = 'placeholder-body';

    const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8b48c, roughness: 0.7 });
    const muscleMat = new THREE.MeshStandardMaterial({ color: 0xb23b3b, roughness: 0.6 });
    const boneMat = new THREE.MeshStandardMaterial({ color: 0xf2eee0, roughness: 0.5 });
    const organMat = new THREE.MeshStandardMaterial({ color: 0x9c3b52, roughness: 0.4 });

    const add = (mesh, name, layer, partId) => {
      mesh.name = name;
      mesh.userData.layer = layer;
      if (partId) mesh.userData.partId = partId;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    };

    // Skin layer — simple humanoid silhouette (capsules).
    const skin = new THREE.Group();
    skin.name = 'skin_layer';
    add(new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.55, 4, 12), skinMat), 'skin_torso', 'skin').position.set(0, 1.15, 0);
    add(new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), skinMat), 'skin_head', 'skin').position.set(0, 1.78, 0);
    add(new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.5, 4, 8), skinMat), 'skin_arm_l', 'skin').position.set(-0.42, 1.15, 0);
    add(new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.5, 4, 8), skinMat), 'skin_arm_r', 'skin').position.set(0.42, 1.15, 0);
    add(new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.65, 4, 8), skinMat), 'skin_leg_l', 'skin').position.set(-0.15, 0.45, 0);
    add(new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.65, 4, 8), skinMat), 'skin_leg_r', 'skin').position.set(0.15, 0.45, 0);
    group.add(skin);

    // Muscle layer (slightly smaller, hidden by default).
    const muscles = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.5, 4, 12), muscleMat);
    add(muscles, 'muscle_torso', 'muscles').position.set(0, 1.15, 0);
    muscles.visible = false;

    // Skeleton layer (spine placeholder).
    const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 1.0, 8), boneMat);
    add(spine, 'skeleton_spine', 'skeleton').position.set(0, 1.15, -0.05);
    spine.visible = false;

    // Organs — approximate anatomical positions inside the torso.
    const heart = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), organMat);
    add(heart, 'organ_heart', 'organs', 'heart').position.set(-0.05, 1.35, 0.12);
    heart.visible = false;

    const lungL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), organMat);
    add(lungL, 'organ_lung_l', 'organs', 'lungs').position.set(-0.14, 1.35, 0.05);
    lungL.visible = false;
    const lungR = lungL.clone();
    add(lungR, 'organ_lung_r', 'organs', 'lungs').position.set(0.14, 1.35, 0.05);
    lungR.visible = false;

    const liver = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), organMat);
    add(liver, 'organ_liver', 'organs', 'liver').position.set(0.1, 1.05, 0.1);
    liver.visible = false;

    const stomach = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), organMat);
    add(stomach, 'organ_stomach', 'organs', 'stomach').position.set(-0.08, 1.02, 0.1);
    stomach.visible = false;

    const kidneyL = new THREE.Mesh(new THREE.CapsuleGeometry(0.03, 0.06, 4, 8), organMat);
    add(kidneyL, 'organ_kidney_l', 'organs', 'kidneys').position.set(-0.12, 0.95, -0.05);
    kidneyL.visible = false;
    const kidneyR = kidneyL.clone();
    add(kidneyR, 'organ_kidney_r', 'organs', 'kidneys').position.set(0.12, 0.95, -0.05);
    kidneyR.visible = false;

    const brain = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), organMat);
    add(brain, 'organ_brain', 'organs', 'brain').position.set(0, 1.82, 0);
    brain.visible = false;

    // Region anchors (invisible helpers used by the Region Navigator's camera focus).
    const regionAnchors = {
      region_head: [0, 1.78, 0],
      region_thorax: [0, 1.35, 0],
      region_abdomen: [0, 1.0, 0],
      region_pelvis: [0, 0.8, 0],
      region_arm_r: [0.42, 1.15, 0],
      region_leg_r: [0.15, 0.45, 0],
      region_spine: [0, 1.15, -0.1],
    };
    Object.entries(regionAnchors).forEach(([name, pos]) => {
      const anchor = new THREE.Object3D();
      anchor.name = name;
      anchor.position.set(...pos);
      group.add(anchor);
    });

    this.modelRoot.add(group);
    this._placeholderGroup = group;
    return group;
  }

  findRegionAnchor(id) {
    const region = REGIONS.find((r) => r.id === id || r.target === id);
    if (!region) return null;
    return this.modelRoot.getObjectByName(region.target) || null;
  }

  findObjectByPartId(partId) {
    let found = null;
    this.modelRoot.traverse((obj) => {
      if (!found && obj.userData && obj.userData.partId === partId) found = obj;
    });
    return found;
  }

  // ---- disposal (memory-safe) --------------------------------------------

  dispose() {
    if (this.disposed) return;
    this.disposed = true;
    this.stop();
    if (this._resizeObserver) this._resizeObserver.disconnect();
    this.anatomyCamera.dispose();

    this.scene.traverse((obj) => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((m) => {
          Object.values(m).forEach((v) => {
            if (v && v.isTexture) v.dispose();
          });
          m.dispose();
        });
      }
    });

    this.renderer.dispose();
    if (this.renderer.domElement && this.renderer.domElement.parentNode) {
      this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
    }
  }
}


// ───────────────────────────── systems/layerSystem.js ─────────────────────────────
// systems/layerSystem.js — show/hide, opacity, and isolate for each anatomical
// layer (skin/fat/muscles/skeleton/organs/vessels/nerves). Works identically
// on the placeholder body and on a real model, because both tag meshes with
// `userData.layer` using the same ids from data/anatomy-map.js.


class LayerSystem {
  constructor(modelRoot) {
    this.modelRoot = modelRoot;
    this.state = {}; // { [layerId]: { visible, opacity } }
    LAYERS.forEach((l) => {
      this.state[l.id] = { visible: l.defaultVisible, opacity: l.defaultOpacity };
    });
  }

  // Re-scans the current model root (call after a model/placeholder loads)
  // and applies the current state immediately.
  refresh() {
    Object.keys(this.state).forEach((id) => this._applyLayer(id));
  }

  _meshesForLayer(layerId) {
    const meshes = [];
    this.modelRoot.traverse((obj) => {
      if (obj.isMesh && obj.userData.layer === layerId) meshes.push(obj);
    });
    return meshes;
  }

  _applyLayer(layerId) {
    const { visible, opacity } = this.state[layerId];
    this._meshesForLayer(layerId).forEach((mesh) => {
      mesh.visible = visible;
      if (mesh.material) {
        const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
        mats.forEach((m) => {
          m.transparent = opacity < 1;
          m.opacity = opacity;
        });
      }
    });
  }

  setVisible(layerId, visible) {
    if (!this.state[layerId]) return;
    this.state[layerId].visible = visible;
    this._applyLayer(layerId);
  }

  toggle(layerId) {
    if (!this.state[layerId]) return;
    this.setVisible(layerId, !this.state[layerId].visible);
  }

  setOpacity(layerId, opacity) {
    if (!this.state[layerId]) return;
    this.state[layerId].opacity = THREE.MathUtils.clamp(opacity, 0, 1);
    this._applyLayer(layerId);
  }

  // Show only this layer, hide the rest.
  isolate(layerId) {
    Object.keys(this.state).forEach((id) => {
      this.state[id].visible = id === layerId;
      this._applyLayer(id);
    });
  }

  showAll() {
    Object.keys(this.state).forEach((id) => {
      this.state[id].visible = true;
      this._applyLayer(id);
    });
  }
}


// ───────────────────────────── systems/labelSystem.js ─────────────────────────────
// systems/labelSystem.js — renders the info panel (desktop side panel /
// mobile bottom sheet) for the currently selected structure. Pure DOM, no
// Three.js sprites in Phase 1 — simpler and more reliable, and still fully
// satisfies the "Information Panel" requirement. 3D floating labels can be
// added in a later phase without touching this file's public API.


function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

class LabelSystem {
  constructor(panelEl, lang) {
    this.panelEl = panelEl;
    this.lang = lang;
    this.renderEmpty();
  }

  setLang(lang) {
    this.lang = lang;
  }

  renderEmpty() {
    this.panelEl.innerHTML = `<div class="anatomy-info-empty">${esc(anatomyT('infoPanelEmpty', this.lang))}</div>`;
  }

  renderPart(partId) {
    const part = PARTS.find((p) => p.id === partId);
    if (!part) {
      this.renderEmpty();
      return;
    }
    const lang = this.lang === 'ar' ? 'ar' : 'en';
    const diseases = (part.relatedDiseases && part.relatedDiseases[lang]) || [];

    this.panelEl.innerHTML = `
      <div class="anatomy-info-card">
        <div class="anatomy-info-head">
          <div class="anatomy-info-name">${esc(part.names[lang])}</div>
          <div class="anatomy-info-latin">${esc(part.names.latin)}</div>
        </div>
        <div class="anatomy-info-row"><strong>${esc(anatomyT('function_label', this.lang))}:</strong> ${esc(part.function[lang])}</div>
        ${part.bloodSupply ? `<div class="anatomy-info-row"><strong>${esc(anatomyT('bloodSupply_label', this.lang))}:</strong> ${esc(part.bloodSupply[lang])}</div>` : ''}
        ${part.innervation ? `<div class="anatomy-info-row"><strong>${esc(anatomyT('innervation_label', this.lang))}:</strong> ${esc(part.innervation[lang])}</div>` : ''}
        ${diseases.length ? `<div class="anatomy-info-row"><strong>${esc(anatomyT('diseases_label', this.lang))}:</strong> ${diseases.map(esc).join('، ')}</div>` : ''}
      </div>`;
  }
}


// ───────────────────────────── systems/injectionSystem.js ─────────────────────────────
// systems/injectionSystem.js — Injection Master simulator (Phase 2).
//
// Renders a 3D needle at a chosen injection site, lets the trainee set an
// entry angle and a discrete depth level, and scores the attempt against the
// site's textbook-standard ranges from data/injection-sites.js.
//
// HONESTY NOTE: this is a geometric/educational approximation running on the
// Phase-1 placeholder body (see data/injection-sites.js header). It teaches
// site selection, angle, and depth-category reasoning — it does NOT model
// tissue resistance, aspiration, or real per-patient anatomy. That limitation
// is surfaced to the trainee via the disclaimer already shown for the whole
// Anatomy section, and is not hidden here.



const DEPTH_INSERT_LENGTH = { shallow: 0.015, medium: 0.05, deep: 0.11 };
const NEEDLE_LENGTH = 0.16;

class InjectionSystem {
  constructor(engine) {
    this.engine = engine;
    this.currentSite = null;
    this.currentAngle = 90;
    this.currentDepth = 'medium';
    this._inserted = false;
    this._startTime = null;

    this.anchorMarkers = new THREE.Group();
    this.anchorMarkers.name = 'injection-anchors';
    this.engine.scene.add(this.anchorMarkers);

    this._buildNeedle();
    this._buildAnchorMarkers();
    this.hide();
  }

  // ---- setup --------------------------------------------------------

  _buildNeedle() {
    const group = new THREE.Group();
    group.name = 'injection-needle';

    const shaftMat = new THREE.MeshStandardMaterial({ color: 0xd8d8e0, metalness: 0.7, roughness: 0.25 });
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, NEEDLE_LENGTH, 10), shaftMat);
    shaft.position.y = NEEDLE_LENGTH / 2; // pivot at the tip (local origin = tip)
    group.add(shaft);

    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.0025, 0.008, 10), shaftMat);
    tip.position.y = 0.004;
    tip.rotation.x = Math.PI;
    group.add(tip);

    const hubMat = new THREE.MeshStandardMaterial({ color: 0xff8a3d, roughness: 0.4 });
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.03, 10), hubMat);
    hub.position.y = NEEDLE_LENGTH + 0.015;
    group.add(hub);

    group.visible = false;
    this.needle = group;
    this.engine.scene.add(group);
  }

  _buildAnchorMarkers() {
    const mat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.5 });
    INJECTION_SITES.forEach((site) => {
      const marker = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 12), mat.clone());
      marker.position.set(...site.anchor);
      marker.userData.injectionSiteId = site.id;
      marker.visible = false;
      this.anchorMarkers.add(marker);
    });
  }

  _normalAt(anchor) {
    const n = new THREE.Vector3(anchor[0], 0, anchor[2]);
    if (n.lengthSq() < 1e-6) n.set(0, 0, 1);
    return n.normalize();
  }

  // ---- visibility -----------------------------------------------------

  showSitePicker(category) {
    this.anchorMarkers.children.forEach((m) => {
      const site = findInjectionSite(m.userData.injectionSiteId);
      m.visible = !category || site.category === category;
    });
    this.needle.visible = false;
  }

  hide() {
    this.anchorMarkers.children.forEach((m) => (m.visible = false));
    this.needle.visible = false;
  }

  // ---- site selection & needle placement ---------------------------------

  selectSite(siteId) {
    const site = findInjectionSite(siteId);
    if (!site) return null;
    this.currentSite = site;
    this.currentAngle = site.angle.max; // start at the "textbook" angle
    this.currentDepth = site.depthLevel;
    this._inserted = false;
    this._startTime = performance.now();

    this.anchorMarkers.children.forEach((m) => (m.visible = false));
    this.needle.visible = true;
    this._placeNeedle();
    this.engine.anatomyCamera.flyTo(
      [site.anchor[0] * 1.8 + 0.3, site.anchor[1] + 0.15, site.anchor[2] * 1.8 + 0.3],
      site.anchor
    );
    anatomyBus.emit('injection-site-selected', { site });
    return site;
  }

  setAngle(deg) {
    this.currentAngle = THREE.MathUtils.clamp(deg, 0, 90);
    this._placeNeedle();
  }

  setDepth(level) {
    if (!DEPTH_LEVEL_LABEL[level]) return;
    this.currentDepth = level;
    this._placeNeedle();
  }

  _placeNeedle() {
    if (!this.currentSite) return;
    const anchor = new THREE.Vector3(...this.currentSite.anchor);
    const normal = this._normalAt(this.currentSite.anchor);

    // Needle rests tip-at-skin, hovering, until insert() animates it in.
    const hoverOffset = normal.clone().multiplyScalar(0.05);
    this.needle.position.copy(anchor).add(hoverOffset);

    // Orient the needle: local +Y (its shaft axis) should point along
    // `normal` tilted by (90 - angle) toward the skin plane.
    const angleFromSurface = THREE.MathUtils.degToRad(this.currentAngle);
    const tangent = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
    if (tangent.lengthSq() < 1e-6) tangent.set(1, 0, 0);
    const dir = normal.clone().multiplyScalar(Math.sin(angleFromSurface))
      .add(tangent.multiplyScalar(Math.cos(angleFromSurface)))
      .normalize();

    const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir.negate());
    this.needle.quaternion.copy(quat);
  }

  // ---- insertion + scoring --------------------------------------------

  insert() {
    if (!this.currentSite || this._inserted) return null;
    this._inserted = true;

    const anchor = new THREE.Vector3(...this.currentSite.anchor);
    const normal = this._normalAt(this.currentSite.anchor);
    const insertDepth = DEPTH_INSERT_LENGTH[this.currentDepth] || 0.05;
    const target = anchor.clone().add(normal.clone().multiplyScalar(-insertDepth * 0.15));

    const start = this.needle.position.clone();
    const startTime = performance.now();
    const duration = 350;
    const step = (now) => {
      const t = Math.min(1, (now - startTime) / duration);
      this.needle.position.lerpVectors(start, target, t);
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);

    const elapsedMs = performance.now() - this._startTime;
    const result = this._score(elapsedMs);
    anatomyBus.emit('injection-scored', result);
    return result;
  }

  _score(elapsedMs) {
    const site = this.currentSite;
    const lang = 'both';

    // Angle score (max 60 in free-practice mode).
    const { min, max } = site.angle;
    let angleScore;
    if (this.currentAngle >= min && this.currentAngle <= max) {
      angleScore = 60;
    } else {
      const dist = this.currentAngle < min ? min - this.currentAngle : this.currentAngle - max;
      angleScore = Math.max(0, 60 - dist * 3);
    }

    // Depth score (max 40) — exact category match required (shallow/medium/deep
    // are the taught categories for ID/SC/IM respectively).
    const depthScore = this.currentDepth === site.depthLevel ? 40 : (
      // adjacent category (e.g., medium vs deep) still gets partial credit
      Math.abs(['shallow', 'medium', 'deep'].indexOf(this.currentDepth) - ['shallow', 'medium', 'deep'].indexOf(site.depthLevel)) === 1 ? 15 : 0
    );

    const total = Math.round(angleScore + depthScore);

    return {
      site,
      total,
      angleScore: Math.round(angleScore),
      depthScore: Math.round(depthScore),
      angleOk: this.currentAngle >= min && this.currentAngle <= max,
      depthOk: this.currentDepth === site.depthLevel,
      chosenAngle: this.currentAngle,
      chosenDepth: this.currentDepth,
      elapsedMs: Math.round(elapsedMs),
    };
  }

  dispose() {
    this.engine.scene.remove(this.needle, this.anchorMarkers);
  }
}


// ───────────────────────────── anatomy.js ─────────────────────────────
// anatomy.js — Phase 1 (3D core viewer) + Phase 2 (Injection Master) entry
// point + public window.AnatomyAPI.
// Loaded as a <script type="module">. Builds nothing until AnatomyAPI.open()
// is called (lazy init — first call to switchTab('anatomy') in the host site).










const MODEL_URL = 'body.glb';

class AnatomySystem {
  constructor() {
    this.built = false;
    this.engine = null;
    this.layerSystem = null;
    this.labelSystem = null;
    this.injectionSystem = null;
    this.selector = null;
    this.mode = 'explore'; // 'explore' | 'injection'
    this.lang = (window.currentLang === 'ar') ? 'ar' : 'en';
  }

  // ---- public API ---------------------------------------------------

  async open(options = {}) {
    const containerId = options.container || 'anatomy-viewer-root';
    this.container = document.getElementById(containerId);
    if (!this.container) {
      console.error('[Anatomy] container not found:', containerId);
      return;
    }
    if (options.language) this.lang = options.language === 'ar' ? 'ar' : 'en';

    if (!this.built) {
      await this._build();
      this.built = true;
    } else {
      this.engine.start((fps) => this._updateFps(fps));
    }
    if (options.injectionSite) this.showInjectionSite(options.injectionSite);
    anatomyBus.emit('open');
  }

  close() {
    if (this.engine) this.engine.stop();
    anatomyBus.emit('close');
  }

  focusOn(name) {
    if (!this.built) return;
    const part = PARTS.find((p) => p.id === name || p.names.en.toLowerCase() === String(name).toLowerCase() || p.names.ar === name);
    if (part) {
      const obj = this.engine.findObjectByPartId(part.id);
      if (obj) {
        this.engine.anatomyCamera.focusOnObject3D(obj);
        this._select(part.id);
        return;
      }
    }
    const region = REGIONS.find((r) => r.id === name);
    if (region) {
      const anchor = this.engine.findRegionAnchor(region.id);
      if (anchor) this.engine.anatomyCamera.flyTo(
        [anchor.position.x + 0.8, anchor.position.y + 0.3, anchor.position.z + 1.2],
        [anchor.position.x, anchor.position.y, anchor.position.z]
      );
    }
  }

  // Phase 2 — now implemented for real.
  showInjectionSite(siteId) {
    if (!this.built) return;
    this._setMode('injection');
    const site = findInjectionSite(siteId);
    if (!site) {
      console.warn('[Anatomy] unknown injection site id:', siteId);
      return;
    }
    this._selectCategory(site.category);
    this._selectInjectionSite(site.id);
  }

  on(event, cb) {
    anatomyBus.on(event, cb);
  }

  // Phase 3+ methods — intentionally NOT faked. They log clearly instead of
  // pretending to work, per the project's "no placeholders for core features"
  // rule (this only applies to features that ARE in scope right now; these
  // are explicitly out of scope until their own phase).
  highlightMultiple() { this._notImplemented('highlightMultiple', 'a later phase'); }
  runProcedure() { this._notImplemented('runProcedure', 'Phase 3 (Procedure Simulator)'); }
  compareOrgans() { this._notImplemented('compareOrgans', 'a later phase'); }
  showDrugMechanism() { this._notImplemented('showDrugMechanism', 'the World Nursing integration phase'); }
  getProgress() { this._notImplemented('getProgress', 'the polish phase'); return null; }
  resetProgress() { this._notImplemented('resetProgress', 'the polish phase'); }

  _notImplemented(name, phase) {
    console.info(`🧬 AnatomyAPI.${name}() ships in ${phase} — not part of this build yet.`);
  }

  // ---- internal build -----------------------------------------------

  async _build() {
    this._renderShell();

    if (!this._webglAvailable()) {
      this._showWebglFallback();
      return;
    }

    const viewport = this.container.querySelector('.anatomy-viewport');
    const loadingEl = this.container.querySelector('.anatomy-loading');
    const noticeEl = this.container.querySelector('.anatomy-notice');
    const fpsEl = this.container.querySelector('.anatomy-fps');
    const infoPanel = this.container.querySelector('.anatomy-info-panel');

    this.engine = new AnatomyEngine(viewport);
    this.labelSystem = new LabelSystem(infoPanel, this.lang);

    const { placeholder } = await this.engine.loadModel(MODEL_URL, {
      onProgress: (p) => {
        if (loadingEl) loadingEl.querySelector('.anatomy-loading-text').textContent =
          `${anatomyT('loading', this.lang)} ${Math.round(p * 100)}%`;
      },
    });

    this.layerSystem = new LayerSystem(this.engine.modelRoot);
    this.layerSystem.refresh();

    this.selector = new AnatomySelector(this.engine.anatomyCamera.camera, this.engine.scene, this.engine.renderer.domElement);
    this.injectionSystem = new InjectionSystem(this.engine);

    if (loadingEl) loadingEl.remove();
    if (placeholder && noticeEl) {
      noticeEl.textContent = anatomyT('placeholderNotice', this.lang);
      noticeEl.style.display = 'block';
    } else if (noticeEl) {
      noticeEl.remove();
    }

    this._wireLayerButtons();
    this._wireViewButtons();
    this._wireModeButtons();
    this._wireSearch();
    this._wireInjectionUI();
    this._wireInjectionPicking();

    anatomyBus.on('select', (payload) => { if (this.mode === 'explore') this._select(payload.partId); });
    anatomyBus.on('select-none', () => { if (this.mode === 'explore') this.labelSystem.renderEmpty(); });

    this.engine.start((fps) => this._updateFps(fps, fpsEl));
  }

  _select(partId) {
    this.labelSystem.renderPart(partId);
    anatomyBus.emit('part-selected', { partId });
  }

  _updateFps(fps, fpsEl) {
    const el = fpsEl || (this.container && this.container.querySelector('.anatomy-fps'));
    if (el) el.textContent = `${fps} ${anatomyT('fps', this.lang)}`;
  }

  _webglAvailable() {
    try {
      const canvas = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
    } catch (e) {
      return false;
    }
  }

  _showWebglFallback() {
    this.container.innerHTML = `<div class="anatomy-webgl-fallback">⚠️ ${esc(anatomyT('webglUnsupported', this.lang))}</div>`;
  }

  _renderShell() {
    const t = (k) => esc(anatomyT(k, this.lang));
    const isAr = this.lang === 'ar';
    this.container.innerHTML = `
      <div class="anatomy-root">
        <div class="anatomy-topbar">
          <div class="anatomy-mode-switch">
            <button class="anatomy-mode-btn active" data-mode="explore">🔎 ${isAr ? 'استكشاف' : 'Explore'}</button>
            <button class="anatomy-mode-btn" data-mode="injection">💉 ${isAr ? 'محاكي الحقن' : 'Injection Master'}</button>
          </div>
          <input type="text" class="anatomy-search" placeholder="${t('searchPlaceholder')}">
        </div>
        <div class="anatomy-body">
          <div class="anatomy-viewport">
            <div class="anatomy-loading"><div class="anatomy-spinner"></div><div class="anatomy-loading-text">${t('loading')}</div></div>
            <div class="anatomy-notice" style="display:none;"></div>
            <div class="anatomy-layers">
              ${LAYERS.map((l) => `<button class="anatomy-layer-btn${l.defaultVisible ? ' active' : ''}" data-layer="${l.id}">● ${t('layer_' + l.id)}</button>`).join('')}
            </div>
            <div class="anatomy-viewctrl">
              <button data-view="reset">${t('view_reset')}</button>
              <button data-view="front">${t('view_front')}</button>
              <button data-view="back">${t('view_back')}</button>
              <button data-view="left">${t('view_left')}</button>
              <button data-view="right">${t('view_right')}</button>
            </div>
            <div class="anatomy-fps"></div>
          </div>
          <div class="anatomy-info-panel"></div>
          <div class="anatomy-injection-panel" style="display:none;">
            <div class="anatomy-inj-categories">
              ${INJECTION_CATEGORIES.map((c) => `<button class="anatomy-inj-cat-btn" data-cat="${c.id}">${isAr ? c.ar : c.en}</button>`).join('')}
            </div>
            <div class="anatomy-inj-sitelist"></div>
            <div class="anatomy-inj-controls" style="display:none;">
              <div class="anatomy-inj-sitename"></div>
              <div class="anatomy-inj-landmark"></div>
              <label class="anatomy-inj-label">${isAr ? 'زاوية الدخول' : 'Entry Angle'}: <span class="anatomy-inj-angle-val">90°</span></label>
              <input type="range" min="0" max="90" value="90" class="anatomy-inj-angle-slider">
              <label class="anatomy-inj-label">${isAr ? 'مستوى العمق' : 'Depth Level'}</label>
              <div class="anatomy-inj-depth-btns">
                <button data-depth="shallow">${isAr ? DEPTH_LEVEL_LABEL.shallow.ar : DEPTH_LEVEL_LABEL.shallow.en}</button>
                <button data-depth="medium">${isAr ? DEPTH_LEVEL_LABEL.medium.ar : DEPTH_LEVEL_LABEL.medium.en}</button>
                <button data-depth="deep">${isAr ? DEPTH_LEVEL_LABEL.deep.ar : DEPTH_LEVEL_LABEL.deep.en}</button>
              </div>
              <button class="anatomy-inj-insert-btn">💉 ${isAr ? 'حقن' : 'Insert'}</button>
            </div>
            <div class="anatomy-inj-feedback"></div>
          </div>
        </div>
        <div class="anatomy-disclaimer">${t('disclaimer')}</div>
      </div>`;
  }

  _wireLayerButtons() {
    this.container.querySelectorAll('.anatomy-layer-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-layer');
        this.layerSystem.toggle(id);
        btn.classList.toggle('active', this.layerSystem.state[id].visible);
      });
    });
  }

  _wireViewButtons() {
    this.container.querySelectorAll('.anatomy-viewctrl button').forEach((btn) => {
      btn.addEventListener('click', () => this.engine.anatomyCamera.goToPreset(btn.getAttribute('data-view')));
    });
  }

  _wireSearch() {
    const input = this.container.querySelector('.anatomy-search');
    if (!input) return;
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        if (this.mode !== 'explore') return;
        const q = input.value.trim().toLowerCase();
        if (!q) return;
        const match = PARTS.find((p) =>
          p.names.ar.includes(q) || p.names.en.toLowerCase().includes(q) || p.names.latin.toLowerCase().includes(q) || p.id.includes(q)
        );
        if (match) this.focusOn(match.id);
      }, 250);
    });
  }

  // ---- mode switching (Explore <-> Injection Master) ----------------

  _wireModeButtons() {
    this.container.querySelectorAll('.anatomy-mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => this._setMode(btn.getAttribute('data-mode')));
    });
  }

  _setMode(mode) {
    this.mode = mode;
    this.container.querySelectorAll('.anatomy-mode-btn').forEach((b) =>
      b.classList.toggle('active', b.getAttribute('data-mode') === mode));

    const infoPanel = this.container.querySelector('.anatomy-info-panel');
    const injPanel = this.container.querySelector('.anatomy-injection-panel');
    const layersUI = this.container.querySelector('.anatomy-layers');

    if (mode === 'injection') {
      infoPanel.style.display = 'none';
      injPanel.style.display = 'block';
      layersUI.style.display = 'none';
      this.layerSystem.isolate('skin');
    } else {
      infoPanel.style.display = '';
      injPanel.style.display = 'none';
      layersUI.style.display = '';
      this.injectionSystem.hide();
      this.layerSystem.setVisible('skin', true);
    }
  }

  // ---- Injection Master UI -------------------------------------------

  _wireInjectionUI() {
    const isAr = this.lang === 'ar';
    this.container.querySelectorAll('.anatomy-inj-cat-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        this.container.querySelectorAll('.anatomy-inj-cat-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        this._selectCategory(btn.getAttribute('data-cat'));
      });
    });

    const angleSlider = this.container.querySelector('.anatomy-inj-angle-slider');
    const angleVal = this.container.querySelector('.anatomy-inj-angle-val');
    angleSlider.addEventListener('input', () => {
      const deg = parseInt(angleSlider.value, 10);
      angleVal.textContent = `${deg}°`;
      this.injectionSystem.setAngle(deg);
    });

    this.container.querySelectorAll('.anatomy-inj-depth-btns button').forEach((btn) => {
      btn.addEventListener('click', () => {
        this.container.querySelectorAll('.anatomy-inj-depth-btns button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        this.injectionSystem.setDepth(btn.getAttribute('data-depth'));
      });
    });

    this.container.querySelector('.anatomy-inj-insert-btn').addEventListener('click', () => {
      const result = this.injectionSystem.insert();
      if (result) this._renderInjectionFeedback(result);
    });
  }

  _selectCategory(catId) {
    this.container.querySelectorAll('.anatomy-inj-cat-btn').forEach((b) =>
      b.classList.toggle('active', b.getAttribute('data-cat') === catId));
    const isAr = this.lang === 'ar';
    const sites = INJECTION_SITES.filter((s) => s.category === catId);
    const listEl = this.container.querySelector('.anatomy-inj-sitelist');
    listEl.innerHTML = sites.map((s) => `<button class="anatomy-inj-site-btn" data-site="${s.id}">${esc(isAr ? s.names.ar : s.names.en)}</button>`).join('');
    listEl.querySelectorAll('.anatomy-inj-site-btn').forEach((btn) => {
      btn.addEventListener('click', () => this._selectInjectionSite(btn.getAttribute('data-site')));
    });
    this.injectionSystem.showSitePicker(catId);
    this.container.querySelector('.anatomy-inj-controls').style.display = 'none';
    this.container.querySelector('.anatomy-inj-feedback').innerHTML = '';
  }

  _selectInjectionSite(siteId) {
    const site = this.injectionSystem.selectSite(siteId);
    if (!site) return;
    const isAr = this.lang === 'ar';

    this.container.querySelectorAll('.anatomy-inj-site-btn').forEach((b) =>
      b.classList.toggle('active', b.getAttribute('data-site') === siteId));

    this.container.querySelector('.anatomy-inj-sitename').textContent = isAr ? site.names.ar : site.names.en;
    this.container.querySelector('.anatomy-inj-landmark').textContent = isAr ? site.landmarks.ar : site.landmarks.en;

    const angleSlider = this.container.querySelector('.anatomy-inj-angle-slider');
    angleSlider.value = site.angle.max;
    this.container.querySelector('.anatomy-inj-angle-val').textContent = `${site.angle.max}°`;

    this.container.querySelectorAll('.anatomy-inj-depth-btns button').forEach((b) =>
      b.classList.toggle('active', b.getAttribute('data-depth') === site.depthLevel));

    this.container.querySelector('.anatomy-inj-controls').style.display = 'block';
    this.container.querySelector('.anatomy-inj-feedback').innerHTML = '';
  }

  _renderInjectionFeedback(result) {
    const isAr = this.lang === 'ar';
    const site = result.site;
    const errors = (site.commonErrors && (isAr ? site.commonErrors.ar : site.commonErrors.en)) || [];
    const danger = site.dangerNote ? (isAr ? site.dangerNote.ar : site.dangerNote.en) : '';
    const seconds = (result.elapsedMs / 1000).toFixed(1);

    this.container.querySelector('.anatomy-inj-feedback').innerHTML = `
      <div class="anatomy-inj-score">${isAr ? 'النتيجة' : 'Score'}: ${result.total}/100</div>
      <div class="anatomy-inj-row ${result.angleOk ? 'ok' : 'bad'}">${result.angleOk ? '✅' : '❌'} ${isAr ? 'الزاوية' : 'Angle'}: ${result.chosenAngle}° (${isAr ? 'المطلوب' : 'target'} ${site.angle.min}–${site.angle.max}°)</div>
      <div class="anatomy-inj-row ${result.depthOk ? 'ok' : 'bad'}">${result.depthOk ? '✅' : '❌'} ${isAr ? 'العمق' : 'Depth'}: ${esc((isAr ? DEPTH_LEVEL_LABEL[result.chosenDepth].ar : DEPTH_LEVEL_LABEL[result.chosenDepth].en))} (${isAr ? 'المطلوب' : 'target'} ${esc(isAr ? DEPTH_LEVEL_LABEL[site.depthLevel].ar : DEPTH_LEVEL_LABEL[site.depthLevel].en)})</div>
      <div class="anatomy-inj-row">⏱ ${isAr ? 'الوقت' : 'Time'}: ${seconds}s</div>
      ${danger ? `<div class="anatomy-inj-danger">⚠️ ${esc(danger)}</div>` : ''}
      ${errors.length ? `<div class="anatomy-inj-errors"><strong>${isAr ? 'أخطاء شائعة' : 'Common errors'}:</strong> ${errors.map(esc).join('، ')}</div>` : ''}
      <button class="anatomy-inj-studymore-btn">${isAr ? '📖 اقرأ المزيد في قسم الحقن' : '📖 Study more in Injections section'}</button>
    `;

    const studyBtn = this.container.querySelector('.anatomy-inj-studymore-btn');
    if (studyBtn) {
      studyBtn.addEventListener('click', () => {
        if (typeof window.switchTab === 'function') window.switchTab('injections');
        const searchInput = document.getElementById('injections-search');
        if (searchInput) {
          searchInput.value = isAr ? site.names.ar : site.names.en;
          if (typeof window.filterInjections === 'function') window.filterInjections();
        }
      });
    }
  }

  // Raycasts against injection anchor markers (separate from AnatomySelector,
  // which only resolves userData.partId — anchors use userData.injectionSiteId).
  _wireInjectionPicking() {
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const dom = this.engine.renderer.domElement;
    let downPos = null;

    dom.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; }, { passive: true });
    dom.addEventListener('pointerup', (e) => {
      if (this.mode !== 'injection') return;
      if (downPos) {
        const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
        if (Math.sqrt(dx * dx + dy * dy) > 6) { downPos = null; return; }
      }
      downPos = null;

      const rect = dom.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, this.engine.anatomyCamera.camera);
      const hits = raycaster.intersectObjects(this.injectionSystem.anchorMarkers.children, false);
      if (hits.length) {
        const siteId = hits[0].object.userData.injectionSiteId;
        this._selectInjectionSite(siteId);
      }
    }, { passive: true });
  }
}

const system = new AnatomySystem();

window.AnatomyAPI = {
  open: (opts) => system.open(opts),
  close: () => system.close(),
  focusOn: (name) => system.focusOn(name),
  highlightMultiple: (...a) => system.highlightMultiple(...a),
  showInjectionSite: (siteId) => system.showInjectionSite(siteId),
  runProcedure: (...a) => system.runProcedure(...a),
  compareOrgans: (...a) => system.compareOrgans(...a),
  showDrugMechanism: (...a) => system.showDrugMechanism(...a),
  getProgress: (...a) => system.getProgress(...a),
  resetProgress: (...a) => system.resetProgress(...a),
  on: (evt, cb) => system.on(evt, cb),
};


// Auto-open immediately since this page IS the anatomy viewer (no tab system here).
window.AnatomyAPI.open({ container: 'anatomy-viewer-root', language: (new URLSearchParams(location.search).get('lang') || document.documentElement.lang || 'ar') });

// Let the parent page (index.html, if embedded in an <iframe>) drive language/open/focus
// via postMessage, so the two files stay in sync without any shared JS file.
window.addEventListener('message', (ev) => {
  const msg = ev.data || {};
  if (msg.type === 'anatomy:setLanguage') location.search = '?lang=' + encodeURIComponent(msg.lang);
  if (msg.type === 'anatomy:focusOn') window.AnatomyAPI.focusOn(msg.name);
  if (msg.type === 'anatomy:showInjectionSite') window.AnatomyAPI.showInjectionSite(msg.site);
});
</script>
